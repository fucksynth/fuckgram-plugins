name: Publish plugins

# A push of plugin sources to "main": the packages are built (only what
# changed), index.json is updated (the client's catalog reads it), and the
# Telegram channel gets the new and the updated plugins (one post per
# plugin, edited in place). The results are committed back here.
#
# The secret CATALOG_SIGNING_KEY (Ed25519, PEM) signs index.json into
# index.signed.json; without it the run fails before anything is posted.
#
# Telegram needs the repository variable TELEGRAM_POSTING = on and the
# secret TELEGRAM_BOT_TOKEN: a bot that is an admin of the channel allowed
# to post, edit and delete messages. Without them only the repository is
# updated. Variables (optional): TELEGRAM_CHAT
# (default @fuckgramplugins), TELEGRAM_NOTIFY ("no": no text message about
# an update).

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      all:
        description: 'Post every plugin again'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the packages.
        run: python tools/build.py

      # index.signed.json: the index with its Ed25519 signature, the only
      # way the client trusts this repository.
      - name: Sign the index.
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: python tools/sign.py

      # Off until the repository variable TELEGRAM_POSTING is "on": the
      # plugins here may need a client that is not released yet.
      - name: Post to Telegram.
        if: vars.TELEGRAM_POSTING == 'on'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
          TELEGRAM_NOTIFY: ${{ vars.TELEGRAM_NOTIFY }}
          ALL: ${{ inputs.all && 'yes' || '' }}
        run: |
          if [ -n "$ALL" ]; then
            python tools/telegram.py --all
          else
            python tools/telegram.py
          fi

      # Also after a failed post: what was posted is remembered.
      - name: Commit the results.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist index.json index.signed.json
          if [ -f channel.json ]; then git add channel.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Publish plugins [skip ci]"
          git push
